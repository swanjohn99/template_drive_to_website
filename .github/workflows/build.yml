name: Build site from Google Drive + Sheets

# Primary trigger: Google Sheets button → Apps Script → repository_dispatch
# (see GOOGLE_SHEETS_SETUP.md). Manual workflow_dispatch remains as backup.
on:
  repository_dispatch:
    types: [rebuild-site]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "scripts/**"
      - "sample/**"
      - ".github/workflows/build.yml"
      - "requirements.txt"
      - "google-apps-script/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        env:
          # Prefer sheet id from Apps Script repository_dispatch payload; then Actions vars/secrets; then config.json
          SPREADSHEET_ID: ${{ github.event.client_payload.spreadsheet_id || vars.SPREADSHEET_ID || secrets.SPREADSHEET_ID }}
          SPREADSHEET_URL: ${{ vars.SPREADSHEET_URL || secrets.SPREADSHEET_URL }}
          SHEET_GID: ${{ github.event.client_payload.sheet_gid || vars.SHEET_GID || '0' }}
          SITE_TITLE: ${{ vars.SITE_TITLE }}
          SITE_TAGLINE: ${{ vars.SITE_TAGLINE }}
          IMAGE_MAX_WIDTH: ${{ vars.IMAGE_MAX_WIDTH || '1400' }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY || '82' }}
        run: python scripts/build.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
